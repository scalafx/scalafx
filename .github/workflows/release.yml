name: GitHub Release

# Creates a GitHub release, with a discussion, when a release tag is pushed.
# The release description is the release notes, `notes/<version>.md`.
on:
  push:
    tags: [ 'v.*' ]

permissions:
  contents: write    # create the release
  discussions: write # create the release discussion

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "Release $TAG" \
            --notes-file "notes/${TAG#v.}.md" --discussion-category "General"
